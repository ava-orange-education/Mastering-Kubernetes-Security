apiVersion: v1
kind: Config
clusters:
  - name: kubernetes
    cluster:
      server: https://api.example.com:6443
      certificate-authority: /etc/kubernetes/pki/ca.crt
users:
  - name: admin-user
    user:
      client-certificate: /etc/kubernetes/pki/admin.crt
      client-key: /etc/kubernetes/pki/admin.key
contexts:
  - name: admin-context
    context:
      cluster: kubernetes
      user: admin-user
current-context: admin-context

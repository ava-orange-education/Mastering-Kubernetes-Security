apiVersion: v1
kind: Namespace
metadata:
  name: demo-rbac
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reader-sa
  namespace: demo-rbac
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: demo-rbac
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reader-binding
  namespace: demo-rbac
subjects:
  - kind: ServiceAccount
    name: reader-sa
    namespace: demo-rbac
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io

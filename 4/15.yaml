apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rbac-editor
  namespace: demo-rbac
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: delegated-role-grantor
  namespace: demo-rbac
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["create"]

  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    resourceNames: ["developer"]
    verbs: ["bind"]

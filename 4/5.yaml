apiVersion: v1
kind: Pod
metadata:
  name: kube-apiserver
  namespace: kube-system
spec:
  containers:
    - name: kube-apiserver
      image: registry.k8s.io/kube-apiserver:v1.36.0
      command:
        - kube-apiserver
        - --authentication-token-webhook-config-file=/etc/kubernetes/auth-webhook.yaml
        - --authentication-token-webhook-cache-ttl=2m
---
apiVersion: v1
kind: Config
clusters:
  - name: auth-webhook
    cluster:
      server: https://auth.example.com/authenticate
      certificate-authority: /etc/kubernetes/pki/auth-webhook-ca.crt

users:
  - name: webhook-client
    user:
      client-certificate: /etc/kubernetes/pki/auth-webhook-client.crt
      client-key: /etc/kubernetes/pki/auth-webhook-client.key

contexts:
  - name: webhook
    context:
      cluster: auth-webhook
      user: webhook-client

current-context: webhook

apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: payments
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: api
          image: registry.corp.example/payments-api@sha256:9f2c8d7a6b4e3c1f0a9d8e7b6c5a4f3e2d1c0b9a8e7d6c5b4a3f2e1d0c9b8a7f
          ports:
            - containerPort: 8080

apiVersion: v1
kind: ServiceAccount
metadata:
  name: cicd-deployer
  namespace: ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deploy-only
  namespace: app-ns
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cicd-deploy-binding
  namespace: app-ns
subjects:
  - kind: ServiceAccount
    name: cicd-deployer
    namespace: ci
roleRef:
  kind: Role
  name: deploy-only
  apiGroup: rbac.authorization.k8s.io

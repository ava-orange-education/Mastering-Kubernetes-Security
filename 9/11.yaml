apiVersion: v1
kind: Secret
metadata:
  name: registry-pull-secret
  namespace: app-ns
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: BASE64_ENCODED_AUTH
---
apiVersion: v1
kind: Pod
metadata:
  name: app
  namespace: app-ns
spec:
  imagePullSecrets:
    - name: registry-pull-secret
  containers:
    - name: app
      image: registry.example.com/app:1.0.0

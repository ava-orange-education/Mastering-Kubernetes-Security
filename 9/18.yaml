apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: block-compromised-image
spec:
  validationActions:
    - Deny

  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods

  variables:
    - name: allContainers
      expression: >
        object.spec.containers +
        object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])

  validations:
    - expression: >
        variables.allContainers.all(c,
          c.image !=
          "registry.example.com/app@sha256:<compromised-image-digest>")
      message: "This image digest is blocked due to a security incident."

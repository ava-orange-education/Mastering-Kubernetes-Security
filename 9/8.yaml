apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-image-signatures
spec:
  validationActions:
    - Deny

  failurePolicy: Fail

  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods

  matchImageReferences:
    - glob: "ghcr.io/example-org/*"

  validationConfigurations:
    required: true
    verifyDigest: true
    mutateDigest: true

  attestors:
    - name: trustedCI
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subject: "https://github.com/example-org/example-repo/.github/workflows/release.yml@refs/heads/main"

          ctlog:
            url: "https://rekor.sigstore.dev"

  validations:
    - expression: >
        images.containers
          .map(image,
            verifyImageSignatures(
              image,
              [attestors.trustedCI]
            )
          )
          .all(result, result > 0)
      message: "Images must be signed by the approved CI workflow."

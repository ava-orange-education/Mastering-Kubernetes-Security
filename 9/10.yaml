apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: require-slsa-provenance
spec:
  validationActions:
    - Deny

  failurePolicy: Fail

  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods

  matchImageReferences:
    - glob: "ghcr.io/example-org/*"

  attestors:
    - name: buildCI
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subject: "https://github.com/example-org/example-repo/.github/workflows/release.yml@refs/heads/main"

  attestations:
    - name: slsaProvenance
      intoto:
        type: "https://slsa.dev/provenance/v1"

  validations:
    - expression: >
        images.containers
          .map(image,
            verifyAttestationSignatures(
              image,
              attestations.slsaProvenance,
              [attestors.buildCI]
            )
          )
          .all(result, result > 0)
      message: "Images must include SLSA provenance signed by the approved build workflow."

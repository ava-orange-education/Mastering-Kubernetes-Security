apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-sa
  namespace: payments

gcloud storage buckets add-iam-policy-binding gs://payments-data \
  --role=roles/storage.objectViewer \
  --member="principal://iam.googleapis.com/projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/PROJECT_ID.svc.id.goog/subject/ns/payments/sa/app-sa"

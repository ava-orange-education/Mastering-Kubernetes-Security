apiVersion: v1
kind: Namespace
metadata:
  name: demo-authz
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: limited-sa
  namespace: demo-authz
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: demo-authz
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader-binding
  namespace: demo-authz
subjects:
  - kind: ServiceAccount
    name: limited-sa
    namespace: demo-authz
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io

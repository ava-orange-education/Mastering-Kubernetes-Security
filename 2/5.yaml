apiVersion: v1
kind: Namespace
metadata:
  name: demo-controller-power
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo-controller-power
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80

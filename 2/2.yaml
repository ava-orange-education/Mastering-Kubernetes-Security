apiVersion: v1
kind: Namespace
metadata:
  name: demo-api-enforcement
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: read-only-sa
  namespace: demo-api-enforcement
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: demo-api-enforcement
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader-binding
  namespace: demo-api-enforcement
subjects:
  - kind: ServiceAccount
    name: read-only-sa
    namespace: demo-api-enforcement
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io

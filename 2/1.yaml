apiVersion: v1
kind: Namespace
metadata:
  name: demo-root-trust
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: attacker-sa
  namespace: demo-root-trust
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: attacker-cluster-admin
subjects:
  - kind: ServiceAccount
    name: attacker-sa
    namespace: demo-root-trust
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io

apiVersion: v1
kind: Pod
metadata:
  name: fsgroup-pod
  namespace: app-ns
spec:
  securityContext:
    runAsUser: 1000
    fsGroup: 2000

  containers:
    - name: app
      image: nginx:1.27
      volumeMounts:
        - name: data
          mountPath: /data

  volumes:
    - name: data
      emptyDir: {}

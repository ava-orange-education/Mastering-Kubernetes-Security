apiVersion: v1
kind: Namespace
metadata:
  name: blocked-ns
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.36
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: block-hostpath
spec:
  validationActions:
    - Deny

  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]

  validations:
    - expression: >
        object.spec.?volumes.orValue([]).all(v, !has(v.hostPath))
      message: "HostPath volumes are not allowed."
---
apiVersion: audit.k8s.io/v1
kind: Policy
rules:
  - level: RequestResponse
    resources:
      - group: ""
        resources: ["pods"]

apiVersion: v1
kind: Pod
metadata:
  name: strict-groups
  namespace: app-ns
spec:
  securityContext:
    runAsUser: 1000
    runAsGroup: 3000
    fsGroup: 2000
    supplementalGroups:
      - 4000
    supplementalGroupsPolicy: Strict

  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "id && sleep 3600"]

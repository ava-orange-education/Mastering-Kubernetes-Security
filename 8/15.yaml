apiVersion: v1
kind: Pod
metadata:
  name: hostpath-pod
  namespace: app-ns
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: ["sleep", "3600"]

      volumeMounts:
        - name: host-root
          mountPath: /host
          readOnly: false

  volumes:
    - name: host-root
      hostPath:
        path: /
        type: Directory

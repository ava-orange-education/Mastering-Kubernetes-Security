apiVersion: v1
kind: Pod
metadata:
  name: drop-all-capabilities
  namespace: app-ns
spec:
  containers:
    - name: app
      image: nginx:1.27
      securityContext:
        capabilities:
          drop:
            - ALL

---
apiVersion: v1
kind: Pod
metadata:
  name: bind-low-port
  namespace: app-ns
spec:
  containers:
    - name: app
      image: nginx:1.27
      securityContext:
        capabilities:
          drop:
            - ALL
          add:
            - NET_BIND_SERVICE

apiVersion: v1
kind: Pod
metadata:
  name: readonly-rootfs
  namespace: app-ns
spec:
  containers:
    - name: app
      image: nginx:1.27
      securityContext:
        readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Pod
metadata:
  name: drop-capabilities
  namespace: app-ns
spec:
  containers:
    - name: app
      image: nginx:1.27
      securityContext:
        capabilities:
          drop:
            - ALL

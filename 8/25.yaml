apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: restricted-impersonation
  namespace: debug
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames: ["debug-only"]
    verbs: ["impersonate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-debug-impersonation
  namespace: debug
subjects:
  - kind: User
    name: alice@example.com
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: restricted-impersonation
  apiGroup: rbac.authorization.k8s.io

apiVersion: v1
kind: Namespace
metadata:
  name: demo-auth
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-sa
  namespace: demo-auth
---
apiVersion: v1
kind: Pod
metadata:
  name: app
  namespace: demo-auth
spec:
  serviceAccountName: app-sa
  containers:
    - name: app
      image: nginx:1.27

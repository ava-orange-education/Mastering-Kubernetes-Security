apiVersion: v1
kind: Pod
metadata:
  name: kube-scheduler
  namespace: kube-system
spec:
  containers:
    - name: kube-scheduler
      image: registry.k8s.io/kube-scheduler:v1.36.0
      command:
        - kube-scheduler
        - --bind-address=127.0.0.1
        - --secure-port=10259
        - --kubeconfig=/etc/kubernetes/scheduler.conf
        - --leader-elect=true
      volumeMounts:
      - name: kubeconfig
      mountPath: /etc/kubernetes/scheduler.conf
      readOnly: true

volumes:
  - name: kubeconfig
    hostPath:
      path: /etc/kubernetes/scheduler.conf
      type: File

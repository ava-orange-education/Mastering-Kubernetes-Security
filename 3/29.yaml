apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-system-pod-ingress
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      app: system-component
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system

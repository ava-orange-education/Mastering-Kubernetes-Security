apiVersion: v1
kind: Pod
metadata:
  name: secure-workload
  namespace: demo-scheduler
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: security-tier
                operator: In
                values:
                  - hardened
  containers:
    - name: app
      image: nginx:1.27

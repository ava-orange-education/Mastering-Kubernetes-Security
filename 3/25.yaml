apiVersion: v1
kind: Pod
metadata:
  name: kube-apiserver
  namespace: kube-system
spec:
  containers:
    - name: kube-apiserver
      image: registry.k8s.io/kube-apiserver:v1.36.0
      command:
        - kube-apiserver
        - --client-ca-file=/etc/pki/enterprise-ca.crt
        - --tls-cert-file=/etc/pki/apiserver.crt
        - --tls-private-key-file=/etc/pki/apiserver.key
      volumeMounts:
        - name: enterprise-pki
          mountPath: /etc/pki
          readOnly: true
  volumes:
    - name: enterprise-pki
      hostPath:
        path: /etc/pki
        type: Directory

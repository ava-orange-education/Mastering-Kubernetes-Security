apiVersion: v1
kind: Pod
metadata:
  name: test-client
  namespace: tenant-a
spec:
  restartPolicy: Never
  containers:
    - name: client
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          wget -qO- --timeout=5 http://service.tenant-b || \
          echo "Cross-namespace access blocked"

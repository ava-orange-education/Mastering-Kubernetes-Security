apiVersion: v1
kind: Pod
metadata:
  name: limited-exposure
  namespace: app-ns
spec:
  containers:
    - name: app
      image: nginx:1.27
      volumeMounts:
        - name: creds
          mountPath: /etc/creds
          readOnly: true
    - name: metrics
      image: busybox
      command: ["sh", "-c", "sleep 3600"]
  volumes:
    - name: creds
      secret:
        secretName: db-credentials

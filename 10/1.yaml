apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: app-ns
type: Opaque
data:
  username: YWRtaW4=
  password: c3VwZXJzZWNyZXQ=
---
apiVersion: v1
kind: Pod
metadata:
  name: secret-volume-pod
  namespace: app-ns
spec:
  containers:
    - name: app
      image: nginx:1.27
      volumeMounts:
        - name: creds
          mountPath: /etc/creds
          readOnly: true
  volumes:
    - name: creds
      secret:
        secretName: db-credentials

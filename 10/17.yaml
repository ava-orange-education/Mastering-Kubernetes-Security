apiVersion: v1
kind: Pod
metadata:
  name: ephemeral-secrets
  namespace: app-ns
spec:
  initContainers:
    - name: prepare-secret
      image: busybox:1.37
      command:
        - sh
        - -c
        - |
          cp /input/password /run/secrets/password
          chmod 0400 /run/secrets/password
      volumeMounts:
        - name: source-secret
          mountPath: /input
          readOnly: true
        - name: temp-secrets
          mountPath: /run/secrets

  containers:
    - name: app
      image: nginx:1.27
      volumeMounts:
        - name: temp-secrets
          mountPath: /run/secrets
          readOnly: true

  volumes:
    - name: source-secret
      secret:
        secretName: db-credentials

    - name: temp-secrets
      emptyDir:
        medium: Memory

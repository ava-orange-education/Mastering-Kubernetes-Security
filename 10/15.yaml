apiVersion: v1
kind: Pod
metadata:
  name: secure-volume
  namespace: app-ns
spec:
  containers:
    - name: app
      image: nginx:1.27
      volumeMounts:
        - name: certs
          mountPath: /etc/certs
          readOnly: true
  volumes:
    - name: certs
      secret:
        secretName: tls-certs
        defaultMode: 0440
        items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key

apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-sa
  namespace: app-ns
---
apiVersion: v1
kind: Pod
metadata:
  name: vault-sidecar-demo
  namespace: app-ns
  annotations:
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/role: "app-role"
    vault.hashicorp.com/agent-inject-secret-config.txt: "secret/data/app/config"
spec:
  serviceAccountName: app-sa

  containers:
    - name: app
      image: nginx:1.27

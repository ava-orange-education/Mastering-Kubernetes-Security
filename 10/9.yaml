apiVersion: v1
kind: ServiceAccount
metadata:
  name: payments-api
  namespace: app-ns
---
apiVersion: v1
kind: Pod
metadata:
  name: projected-token-pod
  namespace: app-ns
spec:
  serviceAccountName: payments-api
  automountServiceAccountToken: false

  containers:
    - name: app
      image: nginx:1.27
      volumeMounts:
        - name: sa-token
          mountPath: /var/run/secrets/tokens
          readOnly: true

  volumes:
    - name: sa-token
      projected:
        sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600

apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloud-app
  namespace: app-ns
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: cloud-secrets
  namespace: app-ns
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    objects: |
      - objectName: "prod/db-credentials"
        objectType: "secretsmanager"
---
apiVersion: v1
kind: Pod
metadata:
  name: cloud-secret-pod
  namespace: app-ns
spec:
  serviceAccountName: cloud-app

  containers:
    - name: app
      image: nginx:1.27
      volumeMounts:
        - name: secrets
          mountPath: /secrets
          readOnly: true

  volumes:
    - name: secrets
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: cloud-secrets

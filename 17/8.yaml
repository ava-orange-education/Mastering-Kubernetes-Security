apiVersion: batch/v1
kind: CronJob
metadata:
  name: hidden-task
  namespace: default
spec:
  schedule: "*/10 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: task
              image: busybox:1.37
              command: ["sh", "-c", "echo 'unexpected scheduled execution'"]
          restartPolicy: OnFailure

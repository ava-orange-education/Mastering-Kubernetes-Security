apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-image-signatures
spec:
  validationActions:
    - Deny
  webhookConfiguration:
    timeoutSeconds: 15
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchImageReferences:
    - glob: "registry.example.com/*"
  validationConfigurations:
    mutateDigest: true
    required: true
    verifyDigest: true
  attestors:
    - name: cosign
      cosign:
        key:
          data: |-
            -----BEGIN PUBLIC KEY-----
            REPLACE_WITH_APPROVED_COSIGN_PUBLIC_KEY
            -----END PUBLIC KEY-----
  validations:
    - expression: >-
        images.containers
          .map(image, verifyImageSignatures(image, [attestors.cosign]))
          .all(result, result > 0)
      message: >-
        Images must be signed by the approved Cosign key.

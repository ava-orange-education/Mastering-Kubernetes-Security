apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: block-privileged-containers
spec:
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers:
        - deployments
        - statefulsets
        - daemonsets
        - jobs
        - cronjobs
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: containers
      expression: >-
        object.spec.containers +
        object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(
          container,
          container.?securityContext.?privileged.orValue(false) == false
        )
      message: >-
        Privileged regular, init, and ephemeral containers are not allowed.

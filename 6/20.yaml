apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    cluster.local:53 {
        errors
        cache 30
        kubernetes cluster.local in-addr.arpa ip6.arpa
    }

    example.com:53 {
        errors
        cache 30
        forward . 10.0.0.20
    }

    internal.corp.local:53 {
        errors
        cache 30
        forward . 10.0.0.10
    }

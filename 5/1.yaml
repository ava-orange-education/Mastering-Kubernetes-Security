apiVersion: v1
kind: Namespace
metadata:
  name: restricted-ns
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
---
apiVersion: v1
kind: Pod
metadata:
  name: privileged-pod
  namespace: restricted-ns
spec:
  containers:
    - name: app
      image: nginx:1.27
      securityContext:
        privileged: true

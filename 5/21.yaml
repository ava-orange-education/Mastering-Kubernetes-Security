apiVersion: v1
kind: Namespace
metadata:
  name: secure-ns
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Pod
metadata:
  name: unsafe-pod
  namespace: secure-ns
spec:
  containers:
    - name: app
      image: nginx:1.27
      securityContext:
        privileged: true

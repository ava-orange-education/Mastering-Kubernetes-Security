apiVersion: wgpolicyk8s.io/v1alpha2
kind: PolicyReport
metadata:
  name: policyreport-namespace
  namespace: team-a
  labels:
    app.kubernetes.io/managed-by: kyverno
results:
  - policy: require-nonroot
    result: fail
    message: "Pods and containers must run as non-root"
    source: KyvernoValidatingPolicy
    scored: true
    properties:
      process: background scan
scope:
  apiVersion: v1
  kind: Pod
  name: nginx
  namespace: team-a
summary:
  pass: 0
  fail: 1
  warn: 0
  error: 0
  skip: 0

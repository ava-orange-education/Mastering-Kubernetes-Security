apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-security-managed-label
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >
          Object{
            metadata: Object.metadata{
              labels: Object.metadata.labels{
                "security.example.com/managed": "true"
              }
            }
          }

apiVersion: v1
kind: Pod
metadata:
  name: hostpath-escape
  namespace: app-ns
spec:
  containers:
    - name: app
      image: busybox
      command: ["sleep", "3600"]
      securityContext:
        runAsUser: 0
        privileged: true
      volumeMounts:
        - name: host-root
          mountPath: /host
  volumes:
    - name: host-root
      hostPath:
        path: /
        type: Directory

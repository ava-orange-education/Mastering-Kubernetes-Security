apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: hardened
handler: hardened
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-hardened-runtimeclass
spec:
  failurePolicy: Fail
  validationActions:
    - Deny
  autogen:
    podControllers:
      controllers:
        - deployments
        - statefulsets
        - daemonsets
        - jobs
        - cronjobs
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        has(object.spec.runtimeClassName) &&
        object.spec.runtimeClassName == "hardened"
      message: >-
        Pods must use runtimeClassName hardened.

apiVersion: v1
kind: Pod
metadata:
  name: socket-exposure-risk
  namespace: app-ns
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: ["sleep", "3600"]
      volumeMounts:
        - name: containerd-socket
          mountPath: /run/containerd/containerd.sock
  volumes:
    - name: containerd-socket
      hostPath:
        path: /run/containerd/containerd.sock
        type: Socket

apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: detect-shell-spawn
spec:
  kprobes:
    - call: "sys_execve"
      syscall: true
      args:
        - index: 0
          type: string
      selectors:
        - matchArgs:
            - index: 0
              operator: In
              values:
                - "/bin/bash"
                - "/bin/sh"
                - "/bin/zsh"
      returnArg:
        index: 0
        type: int

apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-deployer
  namespace: app-ns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ingress-manager
  namespace: app-ns
rules:
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ingress-manager-binding
  namespace: app-ns
subjects:
  - kind: ServiceAccount
    name: app-deployer
    namespace: app-ns
roleRef:
  kind: Role
  name: ingress-manager
  apiGroup: rbac.authorization.k8s.io

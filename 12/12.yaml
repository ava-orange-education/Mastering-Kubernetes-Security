apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-route
  namespace: api-ns
spec:
  parentRefs:
    - name: api-gateway
  hostnames:
    - api.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /admin/
      backendRefs:
        - name: admin-api
          port: 80
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: admin-route-policy
  namespace: api-ns
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: api-gateway

  action: ALLOW

  rules:
    - from:
        - source:
            requestPrincipals:
              - "*"

      to:
        - operation:
            paths:
              - "/admin/*"

      when:
        - key: request.auth.claims[roles]
          values:
            - admin

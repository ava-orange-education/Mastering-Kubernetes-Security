apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal-api-gateway
  namespace: internal-ns
spec:
  gatewayClassName: example-internal-gateway-class

  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: internal.api.example.com

      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: internal-api-tls

      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: internal-api-route
  namespace: internal-ns
spec:
  parentRefs:
    - name: internal-api-gateway
  hostnames:
    - internal.api.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: internal-api-service
          port: 80

apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: app-ns
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: app-ns
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: app-ns
  labels:
    app: frontend
spec:
  serviceAccountName: frontend-sa
  containers:
    - name: app
      image: nginx:1.27
---
apiVersion: v1
kind: Pod
metadata:
  name: backend
  namespace: app-ns
  labels:
    app: backend
spec:
  serviceAccountName: backend-sa
  containers:
    - name: app
      image: nginx:1.27
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: backend-mtls
  namespace: app-ns
spec:
  selector:
    matchLabels:
      app: backend
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-frontend
  namespace: app-ns
spec:
  selector:
    matchLabels:
      app: backend
  action: ALLOW
  rules:
    - from:
        - source:
            serviceAccounts:
              - app-ns/frontend-sa

apiVersion: v1
kind: Namespace
metadata:
  name: app-ns
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-sa
  namespace: app-ns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: app-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      serviceAccountName: web-sa
      containers:
        - name: app
          image: nginx:1.27
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: enforce-mtls
  namespace: app-ns
spec:
  mtls:
    mode: STRICT

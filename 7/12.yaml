apiVersion: v1
kind: Pod
metadata:
  name: app-with-mesh
  namespace: app-ns
spec:
  containers:
    - name: app
      image: nginx:1.27

    - name: istio-proxy
      image: auto
      resources:
        requests:
          cpu: "200m"
          memory: "128Mi"
        limits:
          memory: "256Mi"
